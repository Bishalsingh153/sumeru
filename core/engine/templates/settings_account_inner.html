<div class="sum-settings-hub sum-settings-account">
    <header class="sum-settings-hub-head">
        <div class="sum-settings-hub-head-text">
            <h1 class="sum-settings-hub-title">Account security</h1>
            <p class="sum-settings-hub-lead">Change your login password. You will stay signed in on this browser.</p>
        </div>
        <a href="/web/settings" class="sum-settings-hub-cta">Back to Settings</a>
    </header>

    <form class="sum-settings-account-form" method="post" action="/web/settings/account" data-password-match>
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}"/>
        <div class="sum-form-group-outer sum-field-region--sheet">
            <div class="sum-form-group-grid">
                <label class="sum-field-label" for="password_plain">Password</label>
                <input id="password_plain" name="password_plain" type="password" autocomplete="new-password" required minlength="8" maxlength="72" class="sum-field-input" data-password-primary/>
                <label class="sum-field-label" for="password_plain_confirm">Confirm</label>
                <input id="password_plain_confirm" name="password_plain_confirm" type="password" autocomplete="new-password" required minlength="8" maxlength="72" class="sum-field-input" data-password-confirm/>
                <p class="sum-field-hint" data-password-match-hint role="alert" aria-live="polite" hidden></p>
            </div>
        </div>
        <button type="submit" class="sum-btn sum-btn--primary">Update password</button>
    </form>
</div>
<script src="/static/js/sumeru-password-match.js"></script>
